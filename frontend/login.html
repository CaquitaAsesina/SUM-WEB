  <style>
    :root {
      --red: #E63946; --red-dark: #C1121F; --red-glow: rgba(230,57,70,0.3);
      --bg: #FAFAFA; --card: #FFFFFF; --glass: rgba(255,255,255,0.7);
      --border: rgba(0,0,0,0.08); --text: #1A1A1A; --text2: #555; --muted: #999;
      --blur: blur(20px) saturate(180%);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      background: var(--bg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      overflow: hidden; -webkit-font-smoothing: antialiased;
    }
    .bg-gradient {
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 80%, rgba(230,57,70,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 20%, rgba(230,57,70,0.05) 0%, transparent 60%);
      animation: bgShift 15s ease infinite alternate;
    }
    @keyframes bgShift {
      0% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0.7; transform: scale(0.98); }
    }
    .orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.15; animation: orbFloat 20s ease-in-out infinite alternate; }
    .orb-1 { width: 400px; height: 400px; background: var(--red); top: -100px; left: -100px; }
    .orb-2 { width: 300px; height: 300px; background: var(--red-dark); bottom: -80px; right: -60px; animation-delay: -5s; }
    .orb-3 { width: 250px; height: 250px; background: rgba(230,57,70,0.3); top: 50%; left: 60%; animation-delay: -10s; }
    @keyframes orbFloat {
      0% { transform: translate(0,0) rotate(0deg); }
      33% { transform: translate(30px,-20px) rotate(120deg); }
      66% { transform: translate(-20px,30px) rotate(240deg); }
      100% { transform: translate(10px,-10px) rotate(360deg); }
    }
    .login-container { width:100%; max-width:420px; padding:24px; position:relative; z-index:10; }
    .login-card {
      background: var(--card); backdrop-filter: var(--blur);
      border: 1px solid var(--border); border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.02);
      overflow: hidden; animation: cardIn 0.8s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .login-header { padding: 40px 32px 32px; text-align: center; border-bottom: 1px solid var(--border); }
    .login-header .logo {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, var(--red), var(--red-dark));
      border-radius: 20px; display: inline-flex; align-items: center; justify-content: center;
      font-size: 34px; color: white;
      box-shadow: 0 8px 30px var(--red-glow);
      margin-bottom: 20px;
      animation: logoIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.2s backwards;
    }
    @keyframes logoIn {
      from { opacity: 0; transform: scale(0.5) rotate(-10deg); }
      to { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    .login-header h1 {
      font-size: 24px; font-weight: 800; color: var(--text);
      letter-spacing: -0.03em; margin-bottom: 6px;
      animation: fadeInUp 0.6s ease 0.3s backwards;
    }
    .login-header p {
      font-size: 14px; color: var(--muted); font-weight: 500;
      animation: fadeInUp 0.6s ease 0.4s backwards;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .login-body { padding: 32px; }
    .form-group { margin-bottom: 20px; animation: fadeInUp 0.6s ease 0.5s backwards; }
    .form-group label {
      display: block; font-size: 12px; font-weight: 700;
      color: var(--text2); margin-bottom: 8px;
      letter-spacing: 0.02em; text-transform: uppercase;
    }
    .input-wrapper { position: relative; }
    .input-wrapper i.input-icon {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      font-size: 18px; color: var(--muted);
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      pointer-events: none;
    }
    .input-wrapper input {
      width: 100%; padding: 14px 48px 14px 48px;
      background: rgba(0,0,0,0.03); border: 2px solid var(--border);
      border-radius: 14px; font-size: 15px; color: var(--text);
      font-family: inherit; transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      outline: none;
    }
    .input-wrapper input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 4px rgba(230,57,70,0.1);
      background: white;
    }
    .input-wrapper input:focus ~ i.input-icon { color: var(--red); transform: translateY(-50%) scale(1.15); }
    .input-wrapper input::placeholder { color: var(--muted); }
    .toggle-pass {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 18px; padding: 4px;
      transition: all 0.2s;
    }
    .toggle-pass:hover { color: var(--red); transform: translateY(-50%) scale(1.2); }
    .error-alert {
      background: rgba(230,57,70,0.08); border: 1.5px solid rgba(230,57,70,0.2);
      color: var(--red); border-radius: 12px; padding: 12px 16px;
      font-size: 13px; font-weight: 500; display: none;
      align-items: center; gap: 10px; margin-bottom: 20px;
      animation: shakeIn 0.4s ease;
    }
    .error-alert.show { display: flex; }
    @keyframes shakeIn {
      0% { opacity: 0; transform: translateX(-10px); }
      25% { transform: translateX(6px); }
      50% { transform: translateX(-4px); }
      75% { transform: translateX(2px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    .btn-login {
      width: 100%; padding: 15px;
      background: linear-gradient(135deg, var(--red), var(--red-dark));
      color: white; border: none; border-radius: 14px;
      font-size: 16px; font-weight: 700;
      cursor: pointer; transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      display: flex; align-items: center; justify-content: center; gap: 10px;
      font-family: inherit; letter-spacing: -0.01em;
      position: relative; overflow: hidden;
      animation: fadeInUp 0.6s ease 0.7s backwards;
    }
    .btn-login::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
      opacity: 0; transition: opacity 0.3s;
    }
    .btn-login:hover::before { opacity: 1; }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px var(--red-glow);
    }
    .btn-login:active { transform: translateY(0) scale(0.98); }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-login .spinner {
      width: 20px; height: 20px; border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: white; border-radius: 50%;
      animation: spin 0.7s linear infinite; display: none;
    }
    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

      padding: 24px 32px 28px; text-align: center;
