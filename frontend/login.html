<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta name="robots" content="noindex, nofollow">
  <title> Farmacias Peruanas — Suministros</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍎</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍎</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --red: #FF3B30; --red-dark: #CC2D24; --green: #30D158; --blue: #0A84FF;
      --bg: #0A0A0A; --card: rgba(22,22,22,0.88); --glass: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.08); --text: #F5F5F7; --text2: #A1A1A6; --muted: #6E6E73;
      --blur: blur(40px) saturate(180%);
    }
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Animated gradient background */
    .bg-gradient {
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 80%, rgba(255,59,48,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 20%, rgba(10,132,255,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 50% 50%, rgba(48,209,88,0.05) 0%, transparent 60%);
      animation: bgShift 15s ease infinite alternate;
    }

    @keyframes bgShift {
      0% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0.7; transform: scale(0.98); }
    }

    /* Floating orbs */
    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(80px); opacity: 0.3;
      animation: orbFloat 20s ease-in-out infinite alternate;
    }
    .orb-1 { width: 400px; height: 400px; background: var(--red); top: -100px; left: -100px; animation-delay: 0s; }
    .orb-2 { width: 300px; height: 300px; background: var(--blue); bottom: -80px; right: -60px; animation-delay: -5s; }
    .orb-3 { width: 250px; height: 250px; background: var(--green); top: 50%; left: 60%; animation-delay: -10s; }

    @keyframes orbFloat {
      0% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(30px, -20px) rotate(120deg); }
      66% { transform: translate(-20px, 30px) rotate(240deg); }
      100% { transform: translate(10px, -10px) rotate(360deg); }
    }

    .login-container {
      width: 100%; max-width: 400px; padding: 24px;
      position: relative; z-index: 10;
      animation: fadeUp 0.7s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-card {
      background: var(--card);
      backdrop-filter: var(--blur);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.03);
      overflow: hidden;
    }

    .login-header {
      padding: 36px 28px 28px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .login-header .logo {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--red), var(--red-dark));
      border-radius: 18px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 30px; color: white;
      box-shadow: 0 8px 24px rgba(255,59,48,0.35);
      margin-bottom: 16px;
    }

    .login-header h1 {
      font-size: 22px; font-weight: 700; color: var(--text);
      letter-spacing: -0.03em; margin-bottom: 4px;
    }

    .login-header p { font-size: 13px; color: var(--muted); }

    .login-body { padding: 28px; }

    .form-group {
      margin-bottom: 18px;
      position: relative;
    }

    .form-group label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--text2); margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i.input-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      font-size: 16px; color: var(--muted);
      transition: color 0.2s;
      pointer-events: none;
    }

    .input-wrapper input {
      width: 100%; padding: 12px 42px 12px 42px;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 14px; color: var(--text);
      font-family: inherit;
      transition: all 0.2s;
      outline: none;
    }

    .input-wrapper input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(255,59,48,0.15);
      background: rgba(255,255,255,0.07);
    }

    .input-wrapper input:focus + i.input-icon,
    .input-wrapper input:focus ~ i.input-icon { color: var(--red); }

    .input-wrapper input::placeholder { color: var(--muted); }

    .toggle-pass {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 16px; padding: 4px;
      transition: color 0.2s;
    }

    .toggle-pass:hover { color: var(--text); }

    .error-alert {
      background: rgba(255,59,48,0.1);
      border: 1px solid rgba(255,59,48,0.25);
      color: var(--red);
      border-radius: 10px; padding: 10px 14px;
      font-size: 13px; display: none;
      align-items: center; gap: 8px;
      margin-bottom: 18px;
      animation: slideIn 0.3s ease;
    }

    .error-alert.show { display: flex; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn-login {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, var(--red), var(--red-dark));
      color: white; border: none;
      border-radius: 12px; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: all 0.25s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-family: inherit; letter-spacing: -0.01em;
      position: relative; overflow: hidden;
    }

    .btn-login::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
      opacity: 0; transition: opacity 0.25s;
    }

    .btn-login:hover::before { opacity: 1; }
    .btn-login:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(255,59,48,0.35); }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-login .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .login-footer {
      padding: 20px 28px 24px;
      text-align: center;
      border-top: 1px solid var(--border);
    }

    .role-chips {
      display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    }

    .role-chip {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 12px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 11px; color: var(--text2);
      font-weight: 500;
    }

    .role-chip i { font-size: 13px; }

    .watermark {
      text-align: center; margin-top: 24px;
      font-size: 11px; color: rgba(255,255,255,0.2);
      letter-spacing: -0.01em;
    }

    @media (max-width: 480px) {
      .login-container { padding: 16px; }
      .login-header { padding: 28px 20px 24px; }
      .login-body { padding: 24px 20px; }
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo"><i class="bi bi-hospital"></i></div>
        <h1>Farmacias Peruanas</h1>
        <p>Sistema de Suministros</p>
      </div>

      <div class="login-body">
        <div class="error-alert" id="loginError">
          <i class="bi bi-exclamation-circle-fill"></i>
          <span id="loginErrorText">Error</span>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>Usuario</label>
            <div class="input-wrapper">
              <input type="text" id="loginUsuario" placeholder="Ingrese su usuario" required autocomplete="username" autofocus>
              <i class="bi bi-person input-icon"></i>
            </div>
          </div>

          <div class="form-group">
            <label>Contraseña</label>
            <div class="input-wrapper">
              <input type="password" id="loginPassword" placeholder="Ingrese su contraseña" required autocomplete="current-password">
              <i class="bi bi-lock input-icon"></i>
              <button type="button" class="toggle-pass" onclick="togglePass()">
                <i class="bi bi-eye" id="passIcon"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-login" id="loginBtn">
            <span class="btn-text"><i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión</span>
            <div class="spinner"></div>
          </button>
        </form>
      </div>

      <div class="login-footer">
        <div class="role-chips">
          <div class="role-chip"><i class="bi bi-shield-fill-check" style="color:var(--red);"></i> Admin — control total</div>
          <div class="role-chip"><i class="bi bi-eye-fill" style="color:var(--muted);"></i> Lectura — solo consulta</div>
        </div>
      </div>
    </div>

    <div class="watermark">© 2026 Farmacias Peruanas — Suministros</div>
  </div>

  <script>
    if (localStorage.getItem('fp_token')) window.location.href = '/';

    function togglePass() {
      const inp = document.getElementById('loginPassword');
      const icon = document.getElementById('passIcon');
      inp.type = inp.type === 'password' ? 'text' : 'password';
      icon.className = inp.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const usuario = document.getElementById('loginUsuario').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');
      const errDiv = document.getElementById('loginError');
      const errText = document.getElementById('loginErrorText');

      if (!usuario || !password) {
        errDiv.classList.add('show');
        errText.textContent = 'Ingrese usuario y contraseña.';
        return;
      }

      btn.classList.add('loading');
      btn.disabled = true;
      errDiv.classList.remove('show');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario, password })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('fp_token', data.data.token);
          localStorage.setItem('fp_user', JSON.stringify(data.data.user));
          window.location.href = '/';
        } else {
          errDiv.classList.add('show');
          errText.textContent = data.message || 'Credenciales incorrectas';
        }
      } catch (err) {
        errDiv.classList.add('show');
        errText.textContent = 'Error de conexión con el servidor.';
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
